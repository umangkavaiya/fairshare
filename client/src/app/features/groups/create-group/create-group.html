<div class="max-w-sm mx-auto mt-16 p-6">
  <h1 class="text-2xl font-bold mb-6">Create a group</h1>
  <form (ngSubmit)="onSubmit()" class="space-y-4">
    <input
      [(ngModel)]="name"
      name="name"
      placeholder="Group name"
      class="w-full border rounded px-3 py-2"
      required
    />
    <textarea
      [(ngModel)]="description"
      name="description"
      placeholder="Description (optional)"
      class="w-full border rounded px-3 py-2"
    ></textarea>
    <input
      [(ngModel)]="defaultCurrency"
      name="defaultCurrency"
      placeholder="Currency (e.g. USD)"
      maxlength="3"
      class="w-full border rounded px-3 py-2"
      required
    />
    @if (errorMessage) {
      <p class="text-red-600 text-sm">{{ errorMessage }}</p>
    }
    <button type="submit" class="w-full bg-blue-600 text-white rounded py-2">Create group</button>
  </form>
</div>
